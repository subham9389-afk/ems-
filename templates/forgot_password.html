<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <title>Forgot Password</title>
</head>
<body>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="wip-banner" style="max-width: 340px; margin: 12px auto 0;">⚠ {{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <div class="login-wrap">
    <form method="post" action="{{ url_for('forgot_password') }}" class="card login-card">
      <div class="brand-name" style="color: var(--text);">Reset Password</div>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
        Enter your username and the email on file to set a new password.
      </p>

      <div class="field" style="margin-bottom: 14px;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username }}" required />
      </div>

      <div class="field" style="margin-bottom: 14px;">
        <label for="email">Registered email</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="field" style="margin-bottom: 14px;">
        <label for="new_password">New password</label>
        <div class="password-wrap">
          <input type="password" id="new_password" name="new_password" minlength="4" required />
          <button type="button" class="password-toggle" data-target="new_password" aria-label="Show password" onclick="togglePwd(this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="field" style="margin-bottom: 18px;">
        <label for="confirm_password">Confirm new password</label>
        <div class="password-wrap">
          <input type="password" id="confirm_password" name="confirm_password" minlength="4" required />
          <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Show password" onclick="togglePwd(this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>

      <p style="font-size: 12px; color: var(--text-muted); margin-top: 14px; text-align: center;">
        <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Back to sign in</a>
      </p>
    </form>
  </div>

  <script>
    function togglePwd(btn) {
      var input = document.getElementById(btn.getAttribute('data-target'));
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }
  </script>

</body>
</html>
