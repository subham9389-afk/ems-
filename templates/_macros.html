{% macro status_badge(status) %}
  {% if status == 'Active' %}
    <span class="badge badge-active"><span class="dot"></span>{{ status }}</span>
  {% elif status == 'On Leave' %}
    <span class="badge badge-leave"><span class="dot"></span>{{ status }}</span>
  {% else %}
    <span class="badge badge-resigned"><span class="dot"></span>{{ status }}</span>
  {% endif %}
{% endmacro %}

{% macro avatar(name, size=32) %}
  <div class="avatar-mini" style="width: {{ size }}px; height: {{ size }}px; background: {{ color_for(name) }}22; color: {{ color_for(name) }}; font-size: {{ (size / 2.3)|round|int }}px;">
    {{ initials_for(name) }}
  </div>
{% endmacro %}
