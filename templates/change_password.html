{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <div class="eyebrow">Account</div>
    <h1>Change Password</h1>
    <p class="sub">Update the password for your login.</p>
  </div>
</div>

<form method="post" action="{{ url_for('change_password') }}" class="card form-card">
  <div class="field">
    <label for="current_password">Current password</label>
    <div class="password-wrap">
      <input type="password" id="current_password" name="current_password" required />
      <button type="button" class="password-toggle" data-target="current_password" aria-label="Show password" onclick="togglePwd(this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </div>

  <div class="field">
    <label for="new_password">New password</label>
    <div class="password-wrap">
      <input type="password" id="new_password" name="new_password" minlength="4" required />
      <button type="button" class="password-toggle" data-target="new_password" aria-label="Show password" onclick="togglePwd(this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </div>

  <div class="field">
    <label for="confirm_password">Confirm new password</label>
    <div class="password-wrap">
      <input type="password" id="confirm_password" name="confirm_password" minlength="4" required />
      <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Show password" onclick="togglePwd(this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <p style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">At least 4 characters.</p>
  </div>

  <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Update Password</button>
</form>

<script>
  function togglePwd(btn) {
    var input = document.getElementById(btn.getAttribute('data-target'));
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  }
</script>

{% endblock %}
