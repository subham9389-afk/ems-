{% extends "base.html" %}
{% block title %}{{ 'Edit Announcement' if editing else 'Post Announcement' }}{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <h1>{{ 'Edit Announcement' if editing else 'Post Announcement' }}</h1>
    <p class="sub">Visible to everyone once posted.</p>
  </div>
</div>

<form method="post" action="{{ url_for('edit_announcement', ann_id=ann_id) if editing else url_for('post_announcement') }}" class="card form-card form-card--wide">
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ form.get('title', '') }}" required />
  </div>

  <div class="field">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required style="width: 100%; resize: vertical; font-family: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">{{ form.get('message', '') }}</textarea>
  </div>

  <div style="display: flex; gap: 10px;">
    <button type="submit" class="btn btn-primary" style="align-self: flex-start;">{{ 'Save changes' if editing else 'Post' }}</button>
    <a href="{{ url_for('announcements') }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>

{% endblock %}
